[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-env-checker"
version = "1.0.0"
description = "A CLI tool to inspect Python development environments."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
env-checker = "env_checker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
